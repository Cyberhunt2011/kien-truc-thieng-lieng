<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-weight: 600;
        font-style: normal;
        src: url("og-fonts/cormorant-2.woff2") format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1,
          U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-weight: 600;
        font-style: normal;
        src: url("og-fonts/cormorant-3.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-weight: 600;
        font-style: normal;
        src: url("og-fonts/cormorant-4.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 600;
        font-style: normal;
        src: url("og-fonts/vietnam-3.woff2") format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1,
          U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 600;
        font-style: normal;
        src: url("og-fonts/vietnam-4.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 600;
        font-style: normal;
        src: url("og-fonts/vietnam-5.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0908;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 58% at 50% 48%, rgba(12, 9, 8, 0.42) 0%, rgba(12, 9, 8, 0.18) 55%, rgba(12, 9, 8, 0.55) 100%),
          linear-gradient(180deg, rgba(12, 9, 8, 0.28) 0%, rgba(12, 9, 8, 0.08) 38%, rgba(12, 9, 8, 0.12) 62%, rgba(12, 9, 8, 0.62) 100%);
      }
      .vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 140px 48px #0c0908;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(212, 160, 84, 0.45);
        pointer-events: none;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(243, 234, 215, 0.12);
      }
      .lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 760px;
        text-align: center;
        color: #f3ead7;
      }
      .kicker {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #d4a054;
        margin-bottom: 18px;
      }
      .line1 {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 72px;
        line-height: 0.95;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        text-shadow: 0 2px 18px rgba(12, 9, 8, 0.75);
      }
      .line2 {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 108px;
        line-height: 0.92;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        color: #f3ead7;
        text-shadow: 0 3px 24px rgba(12, 9, 8, 0.8);
        margin-top: 2px;
      }
      .rule {
        width: 120px;
        height: 1px;
        background: #d4a054;
        margin: 22px auto 18px;
      }
      .tag {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #e8c98a;
        text-shadow: 0 2px 12px rgba(12, 9, 8, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="bg" src="../public/images/taj-dawn.jpg" alt="" />
      <div class="scrim"></div>
      <div class="vignette"></div>
      <div class="frame"></div>
      <div class="lockup">
        <div class="kicker">Ấn Độ</div>
        <div class="line1">Kiến Trúc</div>
        <div class="line2">Thiêng</div>
        <div class="rule"></div>
        <div class="tag">Phật giáo · Hồi giáo</div>
      </div>
    </div>
  </body>
</html>
